start_time: "2026-02-12T10:00:00Z"

services:
  - name: auth
    weight: 1.2
  - name: billing
    weight: 1.0
  - name: api-gateway
    weight: 1.5
  - name: worker
    weight: 0.9
  - name: db-proxy
    weight: 0.7

envs:
  prod: 0.84
  stage: 0.11
  dev: 0.05

regions:
  us-east-1: 0.5
  eu-west-1: 0.3
  ap-south-1: 0.2

level_distribution:
  DEBUG: 0.08
  INFO: 0.7
  WARN: 0.14
  ERROR: 0.07
  FATAL: 0.01

format_distribution:
  jsonl: 0.16
  csv: 0.12
  plain: 0.18
  logfmt: 0.12
  syslog: 0.12
  access: 0.12
  multiline: 0.1
  mixed: 0.08

http_methods:
  GET: 0.56
  POST: 0.25
  PUT: 0.1
  DELETE: 0.09

paths:
  - /auth/login
  - /auth/refresh
  - /billing/payments
  - /billing/invoices
  - /api/v1/orders
  - /api/v1/profile
  - /api/v1/health

tags_pool:
  team: [platform, payments, identity, frontend, data]
  tier: [edge, backend, worker]
  source: [api, cron, queue, replay]
  tenant: [acme, beta-corp, northwind, umbrella]

intensity_profile:
  - start_sec: 0
    end_sec: 120
    multiplier: 1.0
  - start_sec: 120
    end_sec: 240
    multiplier: 1.3
  - start_sec: 240
    end_sec: 360
    multiplier: 0.9
  - start_sec: 360
    end_sec: 600
    multiplier: 1.1

spikes:
  probability_per_minute: 0.2
  min_duration_sec: 8
  max_duration_sec: 30
  min_multiplier: 2.5
  max_multiplier: 5.0

incidents:
  - start_sec: 180
    duration_sec: 420
    affected_services: [api-gateway, auth]
    error_rate_multiplier: 3.2
    latency_multiplier: 2.3
    five_xx_boost: 0.28
  - start_sec: 420
    duration_sec: 240
    affected_services: [billing, db-proxy]
    error_rate_multiplier: 2.4
    latency_multiplier: 1.8
    five_xx_boost: 0.22

noise:
  duplicate_rate: 0.015
  out_of_order_rate: 0.03
  out_of_order_max_sec: 10
  missing_field_rate: 0.08
  malformed_rate: 0.012
  timezone_variation_rate: 0.07
  truncated_multiline_rate: 0.15
  mixed_json_rate: 0.45

rotation:
  max_bytes: 1048576
  interval_sec: 60

include_loki_labels: true
